name: Lambda CI/CD deployment

on:
  push:
    branches:
      - main
    paths:
      - "lambda/**"

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up python environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r lambda/requirements.txt -t lambda/

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      #      - name: Run tests
      #        run: python -m pytest

      #      - name: Deploy to AWS Lambda
      #        uses: aws-actions/aws-lambda-deploy@v1
      #        with:
      #          function-name: my-lambda-function
      #          zip-file: lambda.zip
      #          region: eu-west-2
      #          role-arn: arn:aws:iam::123456789012:role/lambda-execution-role

      - name: Deploy lambda function - zips lambda folder and updates the lambda function
        run: |
          cd lambda
          zip -r lambda.zip .
          aws lambda update-function-code --function-name my-test-cicd-lambda --zip-file fileb://lambda.zip
